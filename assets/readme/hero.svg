<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Opus 5.5 Demo</title>
  <desc id="desc">Curated gallery of public Claude Opus 5.5 demos — games, 3D, films, and agents — with featured tiles for Pelican, Tidewater, and PDoom.</desc>

  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="55%" stop-color="#0F131C"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B86D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8B86D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8B86D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipPelican">
      <rect x="0" y="0" width="196" height="118" rx="12"/>
    </clipPath>
    <clipPath id="clipTide">
      <rect x="0" y="0" width="196" height="118" rx="12"/>
    </clipPath>
    <clipPath id="clipPdoom">
      <rect x="0" y="0" width="196" height="118" rx="12"/>
    </clipPath>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="380" rx="24" fill="url(#bgFade)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#1E2433" stroke-width="1.5"/>

  <!-- subtle editorial rule -->
  <rect x="56" y="54" width="120" height="1.5" fill="url(#goldSoft)"/>

  <!-- left title block -->
  <g id="title-block" transform="translate(56 48)">
    <text x="0" y="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" letter-spacing="2.4" fill="#E8B86D">AWESOME LIST · CLAUDE OPUS 5.5</text>

    <text x="0" y="78"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="44" font-weight="700" fill="#F4F1EA">Awesome Opus 5.5 Demo</text>

    <text x="0" y="118"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="17" fill="#8B909A">Public demos people built in the first days —</text>
    <text x="0" y="142"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="17" fill="#8B909A">games, 3D, films, agents.</text>

    <!-- source chips -->
    <g transform="translate(0 178)">
      <rect x="0" y="0" width="72" height="28" rx="8" fill="#151821" stroke="#2A3142" stroke-width="1.5"/>
      <text x="36" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#6EC8FF">GitHub</text>

      <rect x="84" y="0" width="48" height="28" rx="8" fill="#151821" stroke="#2A3142" stroke-width="1.5"/>
      <text x="108" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#6EC8FF">X</text>

      <rect x="144" y="0" width="48" height="28" rx="8" fill="#151821" stroke="#2A3142" stroke-width="1.5"/>
      <text x="168" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#6EC8FF">HN</text>

      <rect x="204" y="0" width="56" height="28" rx="8" fill="#151821" stroke="#2A3142" stroke-width="1.5"/>
      <text x="232" y="18" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#8B909A">CC0</text>
    </g>
  </g>

  <!-- right: three viewport cards (artifact wall) -->
  <g id="viewport-wall" transform="translate(620 56)">

    <!-- Card 1: Pelican -->
    <g transform="translate(0 24) rotate(-4)">
      <rect x="-6" y="-6" width="208" height="168" rx="16" fill="#151821" stroke="#2A3142" stroke-width="1.5"/>
      <g transform="translate(6 6)">
        <g clip-path="url(#clipPelican)">
          <rect width="196" height="118" fill="#1A2030"/>
          <!-- sky wash -->
          <rect width="196" height="70" fill="#24304A"/>
          <!-- ground -->
          <rect y="78" width="196" height="40" fill="#12161F"/>
          <path d="M0 78 Q98 68 196 82 L196 118 L0 118 Z" fill="#161C28"/>
          <!-- bike silhouette -->
          <g transform="translate(58 48)" fill="none" stroke="#E8B86D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="42" r="14"/>
            <circle cx="78" cy="42" r="14"/>
            <path d="M18 42 L40 18 L72 18 L78 42"/>
            <path d="M40 18 L40 6"/>
            <path d="M32 6 L48 6"/>
            <path d="M40 18 L18 42"/>
          </g>
          <!-- tiny bird mark on seat -->
          <ellipse cx="108" cy="58" rx="10" ry="6" fill="#6EC8FF" opacity="0.85"/>
          <path d="M116 56 L128 52" stroke="#6EC8FF" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="0" y="142"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
              font-size="14" font-weight="600" fill="#F4F1EA">Pelican</text>
        <!-- LIVE pill -->
        <rect x="132" y="128" width="52" height="20" rx="10" fill="#1A2E24" stroke="#3D8F6A" stroke-width="1.2"/>
        <circle cx="144" cy="138" r="3.5" fill="#4ADE80"/>
        <text x="168" y="142" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="11" fill="#4ADE80">LIVE</text>
      </g>
    </g>

    <!-- Card 2: Tidewater (center, slight overlap forward) -->
    <g transform="translate(168 0) rotate(2)">
      <rect x="-6" y="-6" width="208" height="168" rx="16" fill="#151821" stroke="#E8B86D" stroke-width="1.5" opacity="0.95"/>
      <g transform="translate(6 6)">
        <g clip-path="url(#clipTide)">
          <rect width="196" height="118" fill="#15202B"/>
          <!-- sky -->
          <rect width="196" height="58" fill="#1C2A3A"/>
          <!-- sun/glow -->
          <circle cx="148" cy="34" r="16" fill="#E8B86D" opacity="0.35"/>
          <circle cx="148" cy="34" r="7" fill="#E8B86D" opacity="0.7"/>
          <!-- horizon water -->
          <rect y="58" width="196" height="60" fill="#1A3344"/>
          <path d="M0 58 Q40 50 80 58 T160 56 T196 60 L196 118 L0 118 Z" fill="#234A5C"/>
          <path d="M0 78 Q50 72 100 80 T196 76" fill="none" stroke="#6EC8FF" stroke-width="1.4" opacity="0.55"/>
          <path d="M0 92 Q60 86 120 94 T196 90" fill="none" stroke="#6EC8FF" stroke-width="1.2" opacity="0.35"/>
          <!-- pier silhouette -->
          <rect x="28" y="52" width="4" height="28" fill="#0B0D12" opacity="0.7"/>
          <rect x="48" y="48" width="4" height="32" fill="#0B0D12" opacity="0.7"/>
          <rect x="24" y="50" width="32" height="3" fill="#0B0D12" opacity="0.7"/>
        </g>
        <text x="0" y="142"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
              font-size="14" font-weight="600" fill="#F4F1EA">Tidewater</text>
        <text x="196" y="142" text-anchor="end"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#8B909A">~275★</text>
      </g>
    </g>

    <!-- Card 3: PDoom -->
    <g transform="translate(336 36) rotate(5)">
      <rect x="-6" y="-6" width="208" height="168" rx="16" fill="#151821" stroke="#2A3142" stroke-width="1.5"/>
      <g transform="translate(6 6)">
        <g clip-path="url(#clipPdoom)">
          <rect width="196" height="118" fill="#1A1520"/>
          <!-- film strip frame -->
          <rect x="14" y="14" width="168" height="90" rx="6" fill="#0B0D12" stroke="#E8B86D" stroke-width="1.5" opacity="0.9"/>
          <!-- sprocket holes -->
          <g fill="#2A3142">
            <rect x="20" y="22" width="8" height="8" rx="1.5"/>
            <rect x="20" y="40" width="8" height="8" rx="1.5"/>
            <rect x="20" y="58" width="8" height="8" rx="1.5"/>
            <rect x="20" y="76" width="8" height="8" rx="1.5"/>
            <rect x="168" y="22" width="8" height="8" rx="1.5"/>
            <rect x="168" y="40" width="8" height="8" rx="1.5"/>
            <rect x="168" y="58" width="8" height="8" rx="1.5"/>
            <rect x="168" y="76" width="8" height="8" rx="1.5"/>
          </g>
          <!-- three frames -->
          <rect x="40" y="28" width="36" height="28" rx="3" fill="#2A2038"/>
          <rect x="82" y="28" width="36" height="28" rx="3" fill="#243044"/>
          <rect x="124" y="28" width="36" height="28" rx="3" fill="#2A2038"/>
          <rect x="40" y="64" width="36" height="28" rx="3" fill="#243044"/>
          <rect x="82" y="64" width="36" height="28" rx="3" fill="#E8B86D" opacity="0.35"/>
          <rect x="124" y="64" width="36" height="28" rx="3" fill="#243044"/>
          <!-- accent bar -->
          <rect x="82" y="64" width="36" height="3" fill="#6EC8FF"/>
        </g>
        <text x="0" y="142"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
              font-size="14" font-weight="600" fill="#F4F1EA">PDoom</text>
        <text x="196" y="142" text-anchor="end"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="12" fill="#8B909A">~602★</text>
      </g>
    </g>
  </g>

  <!-- footer meta strip -->
  <line x1="56" y1="340" x2="1144" y2="340" stroke="#1E2433" stroke-width="1.5"/>
  <text x="56" y="362"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#8B909A">GitHub · X · HN · CC0</text>
  <text x="1144" y="362" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#8B909A">playable · cinematic · agents</text>
</svg>
